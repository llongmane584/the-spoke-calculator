name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - '.env.example'
      - 'docs/**'
      - 'claude/**'
      - 'agents/**'
      # OGP カードのソース。dist/ には入らない。画像そのものを更新したときは
      # public/og-image.png も一緒に変わるので、デプロイはちゃんと走る
      # (paths-ignore は変更パスが全てマッチしたときだけスキップする)。
      - 'og/**'

permissions:
  contents: read
  pages: write
  id-token: write

# cancel-in-progress: false が守るのは「実行中」の run だけ。待機中の run は保護されず、
# 同じグループに新しい待機要求が来た時点で古い方が
# "Canceling since a higher priority waiting request for pages exists" で落ちる ——
# 待機枠がグループに 1 本しかないため。これは公式の Pages ワークフローそのままの意図した
# 挙動で、「実行中の本番デプロイは完走させる / 途中で溜まった run は飛ばして最新だけ出す」。
# 溜まった run のコミットは最新 run の祖先なので、飛ばされても出荷内容は変わらない。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-slim
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Enable pnpm via Corepack
        run: |
          npm install --global corepack@latest
          corepack enable
          # packageManager が唯一の情報源。欠けていたらフォールバックせず落とす ——
          # 別メジャーの pnpm で黙ってビルドが通る方が危険。
          PNPM_SPEC=$(node -p "require('./package.json').packageManager ?? ''")
          if [ -z "$PNPM_SPEC" ]; then
            echo "::error file=package.json::packageManager が未設定です"
            exit 1
          fi
          corepack prepare "$PNPM_SPEC" --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        # actions/deploy-pages#413, #434: action のバンドル依存が非推奨の
        # punycode を参照し DEP0040 警告を出す。当リポジトリ側に原因はない。
        # 上流修正 (v5.0.0 より新しいリリース) が出たら、この env を削除して再確認する。
        env:
          NODE_OPTIONS: '--disable-warning=DEP0040'
